// ===== MODULE 15 — LE SYSTÈME URINAIRE (intégré directement) =====
COURSES.push({id:7,title:"Le Système Urinaire",subtitle:"Module 15 — Anatomie, physiologie et pathologies urinaires",icon:"🫘",blocks:[
{t:"Excrétion rénale et fonctions du rein",h:"<p>L'<strong>excrétion</strong> (ou épuration) est le processus par lequel l'organisme élimine les déchets métaboliques, les substances inutiles ou toxiques, et les médicaments.</p><p>Les substances métabolisées sont éliminées selon 2 voies :</p><ul><li><strong>Élimination biliaire :</strong> métabolites peu solubles → solubilisés dans la bile → éliminés dans les selles.</li><li><strong>Élimination rénale (+++++) :</strong> métabolites hydrosolubles → circulation sanguine → reins → urine.</li></ul><p><strong>Les 3 fonctions du rein :</strong></p><ol><li>Épuration du sang : déchets azotés (urée, acide urique, créatinine)</li><li>Régulation de la volémie et de la composition chimique du sang (PA, sels minéraux)</li><li>Production et activation hormonale : EPO, rénine, vitamine D</li></ol><div class='kp'>💡 <strong>À retenir</strong> : Le rein a 3 fonctions : épuration, régulation de la volémie/PA, et production hormonale (EPO, rénine, vit D). L'élimination rénale est la voie principale pour les métabolites hydrosolubles.</div>"},
{t:"Anatomie du rein et des voies urinaires",h:"<p><strong>Les reins :</strong> 12 cm × 6 cm × 3 cm, 150 g. Contiennent les <strong>pyramides de Malpighi</strong>. Les parois des calices, bassinet et uretère sont formées de tissu musculaire lisse (SNA).</p><p><strong>Le néphron — unité fonctionnelle :</strong> Plus d'<strong>1 million de néphrons</strong> par rein.</p><ul><li><strong>Corpuscule rénal</strong> = glomérule rénal + capsule de Bowman (podocytes)</li><li><strong>Tubule rénal</strong> = tube contourné proximal → anse de Henlé → tube contourné distal → tube collecteur</li></ul><div class='warn'>⚠️ L'<strong>appareil juxta-glomérulaire</strong> sécrète la <strong>rénine</strong> quand la PA ou la concentration de sodium diminue.</div><p><strong>Les voies urinaires :</strong></p><ul><li><strong>Uretères :</strong> 25-30 cm, diamètre 6 mm.</li><li><strong>Vessie :</strong> sac musculaire lisse, capacité 350 ml.</li><li><strong>Urètre :</strong> 3-4 cm chez la femme, 20 cm chez l'homme.</li></ul><p>1er sphincter (interne) : muscle lisse, contrôle <strong>involontaire</strong>. 2ème sphincter (externe) : muscle strié, contrôle <strong>volontaire</strong>.</p><div class='kp'>💡 <strong>À retenir</strong> : Le néphron = corpuscule rénal + tubule rénal. L'urètre féminin (3-4 cm) est court → facteur favorisant les infections urinaires.</div>"},
{t:"Filtration glomérulaire",h:"<p>Formation de l'urine en 3 étapes : <strong>filtration glomérulaire</strong> → <strong>réabsorption tubulaire</strong> → <strong>sécrétion tubulaire</strong>.</p><p>La filtration glomérulaire est un processus <strong>passif</strong>. La membrane de filtration :</p><ul><li><strong>Laisse passer :</strong> eau, glucose, acides aminés, déchets azotés, sels minéraux</li><li><strong>Retient :</strong> cellules sanguines, grosses protéines plasmatiques</li></ul><div class='warn'>⚠️ Si PA &lt; 80 mmHg → insuffisance rénale → oligurie ou anurie.</div><p><strong>DFG (Débit de Filtration Glomérulaire) :</strong> ~120 ml/min chez l'adulte sain.</p><p><strong>Clairance de la créatinine :</strong> la créatinine n'est pas réabsorbée → reflet fidèle du DFG. Utilisée pour <strong>adapter les posologies médicamenteuses</strong> en insuffisance rénale.</p><div class='kp'>💡 <strong>À retenir</strong> : DFG normal ≈ 120 ml/min. Clairance de la créatinine = indicateur de la filtration glomérulaire, essentiel pour adapter les posologies.</div>"},
{t:"Réabsorption et sécrétion tubulaires",h:"<p><strong>99% du filtrat glomérulaire est réabsorbé</strong> (180 L filtrés/24h → ~1,5 L d'urine). 80% dans le tube contourné proximal.</p><p><strong>Réabsorption active</strong> (ATP + transporteurs) : glucose, acides aminés, vitamines, Na+. La créatinine n'est <strong>PAS</strong> réabsorbée.</p><div class='warn'>⚠️ Quand les transporteurs sont saturés, la substance passe dans les urines. Ex : <strong>glycosurie</strong> si glycémie &gt; 1,8 g/L.</div><p><strong>Réabsorption passive</strong> (diffusion, sans énergie) : eau (osmose, suit le Na+), Cl-, HCO3-, urée partiellement.</p><p><strong>Sécrétion tubulaire</strong> : élimine certains médicaments, les ions K+ en excès, régule le pH sanguin (sécrétion H+).</p><div class='kp'>💡 <strong>À retenir</strong> : 99% du filtrat est réabsorbé. Glycosurie si glycémie &gt; 1,8 g/L. Volume urinaire final : ~1,5 L/24h.</div>"},
{t:"Régulation hormonale : aldostérone et ADH",h:"<p><strong>L'aldostérone</strong> (corticosurrénale) : favorise la réabsorption du Na+ et de l'eau (↑ volémie) et la sécrétion du potassium (effet <strong>hypokaliémiant</strong>).</p><p>Cascade si volémie basse :</p><ul><li>↓ PA → sécrétion de <strong>rénine</strong></li><li>Angiotensinogène (foie) → <strong>Angiotensine I</strong></li><li>Enzyme de conversion → <strong>Angiotensine II</strong> (vasoconstricteur)</li><li>↑ aldostérone → ↑ réabsorption Na+/eau → ↑ volémie et PA</li></ul><p><strong>L'ADH / vasopressine</strong> (hypothalamus → hypophyse) : augmente la réabsorption de l'eau dans le tubule collecteur → ↑ volémie. En absence d'ADH → <strong>diabète insipide</strong>.</p><div class='kp'>💡 <strong>À retenir</strong> : Aldostérone : ↑ Na+/eau, ↓ K+. ADH : ↑ réabsorption eau dans tubule collecteur. Cascade rénine-angiotensine-aldostérone activée si volémie basse.</div>"},
{t:"La miction et composition de l'urine",h:"<p>La miction est un acte <strong>volontaire</strong>. Envie d'uriner à partir de <strong>0,3 L</strong>. En rétention, peut dépasser 2 L.</p><p><strong>Composition normale :</strong> 95% eau + déchets azotés (urée, acide urique, créatinine) + ions (Na+, K+, Ca2+…).</p><p><strong>Constituants anormaux :</strong> glucose, protéines, corps cétoniques, hémoglobine, érythrocytes, leucocytes.</p><table><tr><th>Constituant</th><th>Plasma (g/L)</th><th>Urine (g/L)</th></tr><tr><td>Protéines</td><td>80</td><td>0</td></tr><tr><td>Glucose</td><td>1</td><td>0</td></tr><tr><td>Urée</td><td>0,3</td><td>20</td></tr><tr><td>Créatinine</td><td>0,01</td><td>1,2</td></tr><tr><td>Na+</td><td>3,25</td><td>4,5</td></tr><tr><td>K+</td><td>0,2</td><td>1,5</td></tr></table><div class='kp'>💡 <strong>À retenir</strong> : Urine normale : 95% eau + déchets azotés + ions. Glucose, protéines ou sang dans les urines = anormal.</div>"},
{t:"Énurésie et incontinence urinaire",h:"<p><strong>Énurésie :</strong> émission involontaire d'urine chez l'enfant.</p><ul><li><strong>Desmopressine (MINIRINMELT®)</strong> : analogue de l'ADH. Prise au coucher.</li></ul><div class='warn'>⚠️ Restriction hydrique ≥ 1h avant et 8h après la prise.</div><ul><li><strong>Amitriptyline (LAROXYL®)</strong> : anticholinergique. Enfant ≥ 6 ans, en dernier recours. ECG avant instauration.</li></ul><hr><p><strong>Incontinence urinaire :</strong> perte involontaire d'urine. 3 types :</p><ol><li><strong>À l'effort :</strong> fuite lors d'un effort (toux, rire). ↓ résistances urétrales.</li><li><strong>Instabilité vésicale (impérieuse) :</strong> fuites fréquentes/abondantes. Origine infectieuse, inflammatoire ou neurologique (AVC, SEP, Parkinson).</li><li><strong>Mixte :</strong> association des deux. Surtout personnes âgées.</li></ol><p><strong>Traitements de l'instabilité vésicale — Anticholinergiques :</strong></p><ul><li>Oxybutynine : DITROPAN®, DRIPTANE® (liste II)</li><li>Solifénacine : VESICARE®</li><li>Fésotérodine : TOVIAZ®</li><li>Toltérodine : DETRUSITOL® (NR)</li><li>Trospium : CERIS®</li></ul><div class='kp'>💡 <strong>À retenir</strong> : Énurésie → desmopressine (analogue ADH). Instabilité vésicale → anticholinergiques. 3 types d'incontinence : effort, impérieuse, mixte.</div>"},
{t:"Infections urinaires basses — Cystites",h:"<p>Colonisation des urines par des bactéries. Fréquente chez la femme (urètre court, proximité de l'anus). Germe principal : <strong><em>E. coli</em></strong> (voie ascendante).</p><p><strong>Signes cliniques :</strong> brûlures mictionnelles, pollakiurie, douleurs hypogastriques, urines troubles.</p><div class='warn'>⚠️ PAS de fièvre, PAS de frisson, PAS de douleur lombaire → sinon c'est une pyélonéphrite !</div><p><strong>Diagnostic :</strong> bandelettes urinaires (leucocytes + nitrites), ECBU.</p><p><strong>Traitement :</strong></p><ul><li>1ère intention : <strong>Fosfomycine 3g (MONURIL®)</strong> dose unique. Le soir, après vidange vésicale, à distance des repas. Boire ≥ 1,5-2 L/j.</li><li>2ème intention : <strong>Pivmécillinam (SELEXID®)</strong> 800 mg/j, 3 jours.</li></ul><p><strong>Si récidives (&gt;4/an) :</strong> ECBU + nitrofurantoïne 7j, triméthoprime 3j, fosfomycine 3 doses.</p><p><strong>Prévention :</strong> canneberge, bruyère, busserole, solidage. Conseils : boire 1,5-2 L/j, uriner après les rapports sexuels, bonne hygiène locale.</p><div class='kp'>💡 <strong>À retenir</strong> : Cystite = pas de fièvre ni douleur lombaire. Germe : E. coli. Ttt 1ère intention : fosfomycine 3g dose unique.</div>"},
{t:"Adénome prostatique (HBP)",h:"<p>Tumeur <strong>bénigne</strong> de la prostate chez l'homme &gt; 60 ans. Signes : pollakiurie nocturne, dysurie, jet faible, envies urgentes.</p><p><strong>Complications :</strong> infections urinaires, rétention aiguë, calculs rénaux, insuffisance rénale.</p><table><tr><th>Classe</th><th>Exemples</th><th>Mécanisme</th><th>Délai</th><th>EI principaux</th></tr><tr><td><strong>Alpha-bloquants</strong></td><td>Alfuzosine (XATRAL®), Tamsulosine (OMIX®), Silodosine (UROREC®)</td><td>↓ contraction urètre/prostate</td><td>48h</td><td>Hypotension orthostatique, vertiges</td></tr><tr><td><strong>Inhib. 5α-réductase</strong></td><td>Finastéride (CHIBROPROSCAR®), Dutastéride (AVODART®)</td><td>↓ volume prostatique (↓ testostérone)</td><td>6 mois</td><td>Troubles sexuels, gynécomastie</td></tr><tr><td><strong>Phytothérapie</strong></td><td>Serenoa repens (PERMIXON®)</td><td>Non élucidé</td><td>—</td><td>Aucun</td></tr><tr><td><strong>Inhib. PDE5</strong></td><td>Tadalafil (CIALIS® 5mg/j)</td><td>Relaxation muscles lisses</td><td>—</td><td>⚠️ IMCI dérivés nitrés</td></tr></table><p><strong>Association :</strong> COMBODART® = tamsulosine + dutastéride.</p><div class='warn'>⚠️ PROPECIA® = finastéride 1mg → alopécie masculine (dosage différent de CHIBROPROSCAR® 5mg).</div><div class='kp'>💡 <strong>À retenir</strong> : Alpha-bloquants en 1ère intention (48h). Inhib. 5α-réductase en 2ème intention (6 mois). CI absolue inhib. PDE5 + dérivés nitrés.</div>"},
{t:"Glomérulonéphrites, pyélonéphrites et insuffisance rénale",h:"<p><strong>Glomérulonéphrite aiguë :</strong> lésions des glomérules → toujours <strong>protéinurie ± hématurie</strong>. Survient 2-3 semaines après une angine à streptocoque A mal soignée. Symptômes : protéinurie, hématurie, HTA, œdèmes.</p><p><strong>Pyélonéphrite aiguë :</strong> infection du rein. Début brutal, <strong>fièvre + douleurs lombaires</strong> + ECBU positif. Ttt : quinolones 2G (ciprofloxacine CIFLOX®, lévofloxacine TAVANIC®) ou ceftriaxone ROCÉPHINE® IM. EI quinolones : tendinopathies, photosensibilité.</p><div class='warn'>⚠️ Cystite = PAS de fièvre. Pyélonéphrite = FIÈVRE + DOULEURS LOMBAIRES.</div><p><strong>IRA (Insuffisance Rénale Aiguë) :</strong> début brutal, généralement réversible. Cause iatrogène principale : <strong>AINS</strong>.</p><p><strong>IRC (Insuffisance Rénale Chronique) :</strong> progressive, irréversible. Complications : anémie, HTA, hyperkaliémie, acidose. Stade terminal : dialyse + greffe. ⚠️ Adaptation posologique des médicaments.</p><p><strong>Lithiase urinaire :</strong> calculs (oxalate, phosphate de calcium, acide urique). Coliques néphrétiques → AINS + antispasmodiques + hydratation. Calculs &lt; 5mm → élimination spontanée. Sinon : lithotripsie.</p><div class='kp'>💡 <strong>À retenir</strong> : IRA : brutal, réversible, AINS +++. IRC : progressif, irréversible, adapter les posologies. Lithiase &lt; 5mm → spontanée.</div>"}
]});
FLASHCARDS.push(
{id:201,c:7,q:"Quelles sont les 3 fonctions principales du rein ?",a:"1. Épuration du sang (urée, acide urique, créatinine). 2. Régulation de la volémie et de la composition chimique du sang (PA, sels). 3. Production et activation hormonale : EPO, rénine, vitamine D."},
{id:202,c:7,q:"Qu'est-ce que le néphron ?",a:"L'unité fonctionnelle du rein. Plus d'1 million par rein. Composé du corpuscule rénal (glomérule + capsule de Bowman) et du tubule rénal (tube contourné proximal, anse de Henlé, tube contourné distal, tube collecteur)."},
{id:203,c:7,q:"Quelle est la différence de longueur de l'urètre entre la femme et l'homme ?",a:"Femme : 3-4 cm. Homme : 20 cm. La brièveté de l'urètre féminin explique la plus grande fréquence des infections urinaires chez la femme."},
{id:204,c:7,q:"Quelle est la différence entre les 2 sphincters urétraux ?",a:"1er sphincter (interne) : muscle lisse, contrôle INVOLONTAIRE. 2ème sphincter (externe) : muscle strié, contrôle VOLONTAIRE."},
{id:205,c:7,q:"Qu'est-ce que le DFG et quelle est sa valeur normale ?",a:"Débit de Filtration Glomérulaire = quantité de plasma filtrée par les glomérules en une minute. Valeur normale : ~120 ml/min chez l'adulte sain."},
{id:206,c:7,q:"Qu'est-ce que la clairance de la créatinine et à quoi sert-elle ?",a:"Capacité des reins à éliminer la créatinine d'un volume de plasma en une minute. La créatinine n'est pas réabsorbée → reflet fidèle du DFG. Utilisée pour évaluer l'insuffisance rénale et ADAPTER LES POSOLOGIES médicamenteuses."},
{id:207,c:7,q:"Pourquoi survient une glycosurie ?",a:"Quand la glycémie dépasse 1,8 g/L, les transporteurs tubulaires sont saturés : le glucose ne peut plus être totalement réabsorbé et passe dans les urines."},
{id:208,c:7,q:"Quel est le rôle de l'aldostérone au niveau rénal ?",a:"Hormone de la corticosurrénale. Favorise la réabsorption du sodium et de l'eau (↑ volémie) et la sécrétion du potassium (effet hypokaliémiant). Stimulée par l'angiotensine II."},
{id:209,c:7,q:"Quel est le rôle de l'ADH (vasopressine) ?",a:"Sécrétée par l'hypothalamus, stockée dans l'hypophyse. Augmente la réabsorption de l'eau dans le tubule collecteur → ↑ volémie. Absence d'ADH → urines très diluées = diabète insipide."},
{id:210,c:7,q:"Décrire la cascade rénine-angiotensine-aldostérone.",a:"↓ Volémie/PA → rénine → angiotensinogène (foie) → angiotensine I → (enzyme de conversion) → angiotensine II (vasoconstricteur) → ↑ aldostérone → ↑ réabsorption Na+/eau → ↑ volémie et PA."},
{id:211,c:7,q:"Quel médicament est utilisé en 1ère intention dans l'énurésie ? Mécanisme ?",a:"Desmopressine (MINIRINMELT®) : analogue de l'ADH. Réduit la production d'urine nocturne. Prise au coucher avec restriction hydrique ≥ 1h avant et 8h après."},
{id:212,c:7,q:"Quels sont les 3 types d'incontinence urinaire ?",a:"1. À l'effort : fuites lors d'un effort (toux, rire). 2. Instabilité vésicale (impérieuse) : fuites fréquentes/abondantes, origine infectieuse/neurologique. 3. Mixte : association des deux, surtout personnes âgées."},
{id:213,c:7,q:"Quel est le traitement de l'instabilité vésicale ? Mécanisme ?",a:"Antispasmodiques urinaires anticholinergiques : oxybutynine (DITROPAN®), solifénacine (VESICARE®), fésotérodine (TOVIAZ®), toltérodine (DETRUSITOL®), trospium (CERIS®). Ils relaxent le détrusor."},
{id:214,c:7,q:"Quels sont les signes cliniques d'une cystite ? Qu'est-ce qui l'exclut ?",a:"Brûlures mictionnelles, pollakiurie, douleurs hypogastriques, urines troubles. ⚠️ PAS de fièvre, PAS de frisson, PAS de douleur lombaire. Si présents → pyélonéphrite."},
{id:215,c:7,q:"Quel est le traitement de 1ère intention de la cystite simple ?",a:"Fosfomycine 3g (MONURIL®) en dose UNIQUE. Prise le soir après la vidange vésicale, à distance des repas, dissous dans de l'eau. Boire ≥ 1,5-2 L/j."},
{id:216,c:7,q:"Qu'est-ce que la HBP et quels sont ses principaux signes cliniques ?",a:"Hypertrophie Bénigne de la Prostate = tumeur bénigne de la prostate chez l'homme > 60 ans. Signes : pollakiurie nocturne, dysurie (jet faible, retard), envies urgentes, résidu vésical."},
{id:217,c:7,q:"Différence entre alpha-bloquants et inhibiteurs de la 5α-réductase dans la HBP ?",a:"Alpha-bloquants : ↓ contraction urètre/prostate, délai 48h, EI = hypotension orthostatique. Inhib. 5α-réductase (finastéride, dutastéride) : ↓ volume prostatique, délai 6 mois, EI = troubles sexuels, gynécomastie."},
{id:218,c:7,q:"Interaction majeure des inhibiteurs de la PDE5 (tadalafil CIALIS®) dans la HBP ?",a:"IMCI absolue avec les dérivés nitrés → risque d'hypotension artérielle sévère et de collapsus cardiovasculaire."},
{id:219,c:7,q:"Différence entre pyélonéphrite et cystite ?",a:"Cystite : infection limitée à la vessie, PAS de fièvre ni douleur lombaire. Pyélonéphrite : infection du rein, début brutal avec FIÈVRE + DOULEURS LOMBAIRES + ECBU très positif."},
{id:220,c:7,q:"Différence entre IRA et IRC ?",a:"IRA : début brutal, généralement RÉVERSIBLE, cause iatrogène fréquente = AINS. IRC : progressive, généralement IRRÉVERSIBLE. Stade terminal → dialyse. Nécessite adaptation posologique."},
{id:221,c:7,q:"Qu'est-ce que la lithiase urinaire et comment la traiter ?",a:"Présence de calculs (oxalate, phosphate de calcium, acide urique) dans les voies urinaires. Coliques néphrétiques. Ttt : AINS + antispasmodiques + hydratation abondante. Calculs < 5mm → élimination spontanée. Sinon : lithotripsie."},
{id:222,c:7,q:"PROPECIA® vs CHIBROPROSCAR® : même molécule, quelle différence ?",a:"Finastéride 1mg (PROPECIA®) = alopécie androgénique masculine. Finastéride 5mg (CHIBROPROSCAR®) = HBP. Même molécule, dosages et indications différents, non interchangeables."},
{id:223,c:7,q:"Quels antibiotiques sont utilisés dans la pyélonéphrite aiguë ?",a:"Quinolones 2G (voie orale) : ciprofloxacine (CIFLOX®), lévofloxacine (TAVANIC®). EI : tendinopathies, photosensibilité. Ou ceftriaxone (ROCÉPHINE®) en IM. Si allergie : aminosides."},
{id:224,c:7,q:"Quel est le rôle des podocytes dans le glomérule ?",a:"Les podocytes forment le feuillet viscéral de la capsule de Bowman. Leurs prolongements entourent les capillaires glomérulaires et participent à la barrière de filtration."},
{id:225,c:7,q:"À partir de quel volume la vessie signale-t-elle l'envie d'uriner ?",a:"À partir de 0,3 litre (300 ml). Capacité normale : 350 ml. En rétention, peut dépasser 2 litres."}
);
QCMS.push(
{id:201,c:7,q:"Parmi les éléments suivants, lequel N'EST PAS retenu par la membrane de filtration glomérulaire ?",o:["A) Les cellules sanguines","B) Les grosses protéines plasmatiques","C) Le glucose","D) L'albumine"],r:2,e:"La filtration glomérulaire laisse passer l'eau, le glucose, les acides aminés, les déchets azotés et les sels minéraux. Elle retient les cellules sanguines et les grosses protéines plasmatiques (dont l'albumine)."},
{id:202,c:7,q:"Le Débit de Filtration Glomérulaire (DFG) normal chez l'adulte sain est de :",o:["A) 12 ml/min","B) 120 ml/min","C) 1200 ml/min","D) 60 ml/min"],r:1,e:"Le DFG normal est d'environ 120 ml/min pour les 2 reins. Cela correspond à ~180 litres filtrés/24h, dont 99% est réabsorbé, ne laissant que ~1,5 L d'urine finale."},
{id:203,c:7,q:"La clairance de la créatinine est utilisée principalement pour :",o:["A) Diagnostiquer une cystite","B) Évaluer la fonction de filtration rénale et adapter les posologies médicamenteuses","C) Mesurer la glycémie","D) Dépister une infection urinaire"],r:1,e:"La créatinine n'est pas réabsorbée par les tubules, ce qui en fait un marqueur fidèle de la filtration glomérulaire. Sa clairance est essentielle pour évaluer une insuffisance rénale et adapter les posologies."},
{id:204,c:7,q:"La glycosurie apparaît à partir de quelle glycémie ?",o:["A) > 0,8 g/L","B) > 1,8 g/L","C) > 2,5 g/L","D) > 3,0 g/L"],r:1,e:"À partir de 1,8 g/L, les transporteurs tubulaires sont saturés : le glucose ne peut plus être totalement réabsorbé et passe dans les urines (glycosurie)."},
{id:205,c:7,q:"L'ADH (vasopressine) agit principalement en :",o:["A) Favorisant la sécrétion de potassium","B) Augmentant la réabsorption de l'eau dans le tubule collecteur","C) Inhibant la synthèse de rénine","D) Augmentant la filtration glomérulaire"],r:1,e:"L'ADH augmente la réabsorption de l'eau dans le tubule collecteur → ↑ volémie. En son absence → urines très diluées (diabète insipide)."},
{id:206,c:7,q:"Dans la cascade rénine-angiotensine, quelle enzyme transforme l'angiotensine I en angiotensine II ?",o:["A) La rénine","B) L'aldostérone synthase","C) L'enzyme de conversion (ECA)","D) La DHFR"],r:2,e:"L'enzyme de conversion de l'angiotensine (ECA) transforme l'angiotensine I en angiotensine II, puissant vasoconstricteur qui stimule la sécrétion d'aldostérone. Les IEC bloquent cette étape."},
{id:207,c:7,q:"La desmopressine (MINIRINMELT®) utilisée dans l'énurésie est un :",o:["A) Anticholinergique","B) Analogue de l'ADH (vasopressine)","C) Alpha-bloquant","D) Inhibiteur de la 5α-réductase"],r:1,e:"La desmopressine est un analogue synthétique de l'ADH. Elle réduit la production d'urine nocturne. Précaution : restriction hydrique autour de la prise."},
{id:208,c:7,q:"Lequel de ces signes EXCLUT le diagnostic de cystite simple et doit faire suspecter une pyélonéphrite ?",o:["A) Brûlures mictionnelles","B) Pollakiurie","C) Fièvre et douleurs lombaires","D) Urines troubles"],r:2,e:"La cystite simple = PAS de fièvre, PAS de frisson, PAS de douleur lombaire. La présence de fièvre et/ou douleurs lombaires signe l'atteinte rénale (pyélonéphrite)."},
{id:209,c:7,q:"Quel est le traitement antibiotique de 1ère intention de la cystite simple ?",o:["A) Amoxicilline 1g × 3/j pendant 7 jours","B) Fosfomycine 3g en dose unique","C) Ciprofloxacine 500mg × 2/j pendant 5 jours","D) Ceftriaxone 1g IM en dose unique"],r:1,e:"La fosfomycine 3g (MONURIL®) en dose unique est le traitement de 1ère intention. Avantages : dose unique (compliance), spectre adapté, faible résistance d'E. coli."},
{id:210,c:7,q:"Dans la HBP, quelle classe médicamenteuse a un délai d'action de 6 mois et réduit le volume prostatique ?",o:["A) Les alpha-bloquants","B) Les inhibiteurs de la PDE5","C) Les inhibiteurs de la 5α-réductase","D) La phytothérapie (Serenoa repens)"],r:2,e:"Les inhibiteurs de la 5α-réductase (finastéride, dutastéride) réduisent la synthèse de testostérone → réduction du volume prostatique. Délai : 6 mois. EI : troubles sexuels, gynécomastie."},
{id:211,c:7,q:"L'effet indésirable caractéristique des alpha-bloquants (alfuzosine, tamsulosine) est :",o:["A) Gynécomastie","B) Hypotension orthostatique","C) Tendinopathie","D) Hyperkaliémie"],r:1,e:"Les alpha-bloquants entraînent une vasodilatation → risque d'hypotension orthostatique (vertiges, malaises à la levée). Délai d'efficacité : 48h."},
{id:212,c:7,q:"Quelle est la CI absolue (IMCI) des inhibiteurs de la PDE5 (tadalafil CIALIS®) ?",o:["A) Les inhibiteurs de la 5α-réductase","B) Les dérivés nitrés","C) Les fluoroquinolones","D) Les anticholinergiques"],r:1,e:"L'association inhib. PDE5 + dérivés nitrés est une IMCI : risque d'hypotension artérielle sévère et de collapsus cardiovasculaire par potentialisation des effets vasodilatateurs."},
{id:213,c:7,q:"Quelle est la principale cause iatrogène d'insuffisance rénale aiguë ?",o:["A) Les antibiotiques (amoxicilline)","B) Les AINS","C) Les antispasmodiques urinaires","D) Les inhibiteurs de la PDE5"],r:1,e:"Les AINS inhibent les prostaglandines qui maintiennent la vasodilatation rénale → IRA iatrogène, notamment en cas de déshydratation ou d'insuffisance rénale préexistante."},
{id:214,c:7,q:"PROPECIA® et CHIBROPROSCAR® contiennent la même molécule. Quelle est la différence ?",o:["A) PROPECIA® est indiqué dans la HBP, CHIBROPROSCAR® dans l'alopécie","B) PROPECIA® 1mg = alopécie androgénique masculine ; CHIBROPROSCAR® 5mg = HBP","C) Ce sont deux médicaments strictement identiques et interchangeables","D) PROPECIA® s'administre par voie injectable"],r:1,e:"PROPECIA® = finastéride 1mg → alopécie. CHIBROPROSCAR® = finastéride 5mg → HBP. Même molécule, dosages et indications différents, NON interchangeables."},
{id:215,c:7,q:"Quel antibiotique de la famille des quinolones est utilisé dans la pyélonéphrite aiguë ?",o:["A) Amoxicilline","B) Fosfomycine","C) Ciprofloxacine (CIFLOX®)","D) Nitrofurantoïne"],r:2,e:"La ciprofloxacine (CIFLOX®) et la lévofloxacine (TAVANIC®) sont des quinolones de 2ème génération utilisées dans la pyélonéphrite aiguë. EI importants : tendinopathies, photosensibilité."},
{id:216,c:7,q:"La glomérulonéphrite aiguë infectieuse est une complication de :",o:["A) Une cystite à E. coli","B) Une angine à streptocoque A mal soignée","C) Une lithiase urinaire","D) Une HBP non traitée"],r:1,e:"La glomérulonéphrite aiguë infectieuse touche surtout l'enfant, 2-3 semaines après une angine à streptocoque A insuffisamment traitée. Signes : protéinurie, hématurie, HTA, œdèmes."},
{id:217,c:7,q:"Quelle est la différence entre IRA et IRC ?",o:["A) L'IRA est irréversible, l'IRC est réversible","B) L'IRA est brutale et généralement réversible ; l'IRC est progressive et généralement irréversible","C) L'IRA touche uniquement les personnes âgées","D) Il n'y a pas de différence clinique"],r:1,e:"IRA : début brutal, généralement réversible si cause traitée. IRC : évolution progressive et insidieuse, généralement irréversible, peut nécessiter la dialyse."},
{id:218,c:7,q:"Pour les calculs urinaires de quelle taille l'élimination est-elle spontanée ?",o:["A) < 10 mm","B) < 5 mm","C) < 2 mm","D) Tous les calculs s'éliminent spontanément"],r:1,e:"Les calculs inférieurs à 5 mm s'éliminent généralement spontanément avec une hydratation abondante. Au-delà, on peut recourir à la lithotripsie, l'endoscopie ou la chirurgie."},
{id:219,c:7,q:"L'aldostérone a quel effet sur la kaliémie ?",o:["A) Elle est hyperkaliémiante (↑ K+)","B) Elle est hypokaliémiante (↓ K+)","C) Elle n'a pas d'effet sur le potassium","D) Elle augmente la réabsorption du potassium"],r:1,e:"L'aldostérone favorise la réabsorption du Na+ et de l'eau ET la sécrétion du potassium → elle est hypokaliémiante. Un excès d'aldostérone (hyperaldostéronisme) peut causer une hypokaliémie."},
{id:220,c:7,q:"Question de synthèse — Associez : Fosfomycine / Desmopressine / Alfuzosine / Solifénacine / Ciprofloxacine",o:["A) Fosfomycine=pyélonéphrite ; Desmopressine=incontinence ; Alfuzosine=cystite","B) Fosfomycine=cystite ; Desmopressine=énurésie ; Alfuzosine=HBP ; Solifénacine=instabilité vésicale ; Ciprofloxacine=pyélonéphrite","C) Fosfomycine=HBP ; Desmopressine=cystite ; Alfuzosine=pyélonéphrite","D) Toutes les associations sont incorrectes"],r:1,e:"Fosfomycine (MONURIL®)=cystite | Desmopressine (MINIRINMELT®)=énurésie | Alfuzosine (XATRAL®)=HBP | Solifénacine (VESICARE®)=instabilité vésicale | Ciprofloxacine (CIFLOX®)=pyélonéphrite."}
);

// ===== STATE =====
const LS='shanoe';
let toastTimer=null;
function defaults(){return{page:'library',courseId:null,tab:'cours',statuses:{},fcProgress:{},qcmAnswers:{},apiKey:'',quizMessages:{},showSettings:false,expandedBlocks:{},fcFlipped:false,fcIndex:0,qcmIndex:0,qcmAnswered:false,qcmSelected:-1,qcmScore:0,qcmShuffled:[],quizLoading:false,toastMsg:'',toastVisible:false}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS)||'{}');return{...defaults(),...s}}catch(e){return defaults()}}
function saveState(){localStorage.setItem(LS,JSON.stringify({statuses:S.statuses,fcProgress:S.fcProgress,qcmAnswers:S.qcmAnswers,apiKey:S.apiKey,quizMessages:S.quizMessages}))}
let S=loadState();

// ===== SM-2 =====
function sm2(q,p){let{reps:r=0,ef:e=2.5,interval:i=0}=p||{};if(q>=3){if(r===0)i=1;else if(r===1)i=6;else i=Math.round(i*e);r++}else{r=0;i=1}e=Math.max(1.3,e+.1-(5-q)*(.08+(5-q)*.02));return{reps:r,ef:e,interval:i,next:Date.now()+i*864e5}}

// ===== UTILS =====
function progress(cid){const f=FLASHCARDS.filter(x=>x.c===cid),q=QCMS.filter(x=>x.c===cid),fd=f.filter(x=>S.fcProgress[x.id]&&S.fcProgress[x.id].reps>0).length,qd=q.filter(x=>S.qcmAnswers[x.id]!==undefined).length,t=f.length+q.length;return t===0?0:Math.round((fd+qd)/t*100)}
function fcQueue(cid){const now=Date.now(),due=[],fresh=[];FLASHCARDS.filter(f=>f.c===cid).forEach(fc=>{const p=S.fcProgress[fc.id];if(!p)fresh.push(fc);else if(p.next<=now)due.push(fc)});return[...due,...fresh]}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function stClass(cid){return'status-'+(S.statuses[cid]||'upcoming')}
function stLabel(cid){return{upcoming:'À venir',inprogress:'En cours',completed:'Terminé'}[S.statuses[cid]||'upcoming']}

// ===== RENDER =====
function render(){const app=document.getElementById('app');let h=renderHeader();if(S.page==='library')h+=renderLibrary();else if(S.page==='course')h+=renderCourse();if(S.showSettings)h+=renderModal();h+='<div class="toast '+(S.toastVisible?'show':'')+'">'+(S.toastMsg||'')+'</div>';app.innerHTML=h;if(S.page==='course'&&S.tab==='quiz'){const cm=document.querySelector('.chat-messages');if(cm)cm.scrollTop=cm.scrollHeight}}

function renderHeader(){return'<header class="header"><div><h1>Shanoe</h1><p>Révisions médicales et pharmaceutiques</p></div><div><button class="btn-icon" data-action="open-settings" title="Paramètres">⚙️</button></div></header>'}

function renderLibrary(){return'<div class="main"><div class="section-header"><h2>Bibliothèque de cours</h2><p>Sélectionnez un cours pour commencer vos révisions</p></div><div class="course-grid">'+COURSES.map(c=>{const p=progress(c.id),fc=FLASHCARDS.filter(f=>f.c===c.id).length,qc=QCMS.filter(q=>q.c===c.id).length;return'<div class="course-card" data-action="open-course" data-id="'+c.id+'"><div style="display:flex;justify-content:space-between;align-items:start"><div class="icon">'+c.icon+'</div><span class="status-badge '+stClass(c.id)+'" data-action="cycle-status" data-id="'+c.id+'">'+stLabel(c.id)+'</span></div><h3>'+c.title+'</h3><p class="subtitle">'+c.subtitle+'</p><div style="display:flex;gap:12px;font-size:.8rem;color:var(--tl);margin-bottom:8px"><span>📇 '+fc+' flashcards</span><span>✅ '+qc+' QCM</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+p+'%"></div></div><div style="text-align:right;font-size:.8rem;color:var(--tl);margin-top:4px">'+p+'%</div></div>'}).join('')+'</div></div>'}

function renderCourse(){const c=COURSES.find(x=>x.id===S.courseId);if(!c)return'<div class="main"><p>Cours introuvable.</p></div>';const tabs=[{id:'cours',l:'📖 Cours'},{id:'flashcards',l:'📇 Flashcards'},{id:'qcm',l:'✅ QCM'},{id:'quiz',l:'🤖 Quiz IA'}];let tc='';switch(S.tab){case'cours':tc=renderCoursTab(c);break;case'flashcards':tc=renderFCTab(c);break;case'qcm':tc=renderQCMTab(c);break;case'quiz':tc=renderQuizTab(c);break}return'<div class="main"><button class="back-btn" data-action="back">← Retour à la bibliothèque</button><div class="course-header"><h2>'+c.icon+' '+c.title+'</h2></div><div class="tabs">'+tabs.map(t=>'<button class="tab-btn '+(S.tab===t.id?'active':'')+'" data-action="set-tab" data-tab="'+t.id+'">'+t.l+'</button>').join('')+'</div><div class="tab-content">'+tc+'</div></div>'}

function renderCoursTab(c){return c.blocks.map((b,i)=>{const k=c.id+'-'+i,ex=S.expandedBlocks[k];return'<div class="block"><div class="block-header '+(ex?'expanded':'')+'" data-action="toggle-block" data-key="'+k+'"><span>'+b.t+'</span><span class="arrow">▶</span></div><div class="block-content '+(ex?'expanded':'')+'">'+b.h+'</div></div>'}).join('')}

function renderFCTab(c){const q=fcQueue(c.id),all=FLASHCARDS.filter(f=>f.c===c.id),rv=all.filter(f=>S.fcProgress[f.id]&&S.fcProgress[f.id].reps>0).length,du=all.filter(f=>{const p=S.fcProgress[f.id];return p&&p.next<=Date.now()}).length,fr=all.filter(f=>!S.fcProgress[f.id]).length;let ch='';if(q.length===0){ch='<div class="fc-done"><div class="emoji">🎉</div><h3>Bravo !</h3><p style="color:var(--tl);margin-top:8px">Toutes les flashcards ont été révisées. Revenez plus tard pour les révisions espacées.</p></div>'}else{const card=q[S.fcIndex%q.length];if(card){ch='<div class="fc-counter">Carte '+(S.fcIndex%q.length+1)+' / '+q.length+'</div><div class="fc-card-container"><div class="fc-card '+(S.fcFlipped?'flipped':'')+'" data-action="flip-card"><div class="fc-front"><p>'+card.q+'</p><div class="fc-hint">Cliquez ou Espace pour retourner</div></div><div class="fc-back"><p>'+card.a+'</p></div></div></div>'+(S.fcFlipped?'<div class="fc-rating"><button class="rate-again" data-action="rate-card" data-quality="1" data-fcid="'+card.id+'">🔄 À revoir</button><button class="rate-hard" data-action="rate-card" data-quality="3" data-fcid="'+card.id+'">😤 Difficile</button><button class="rate-good" data-action="rate-card" data-quality="4" data-fcid="'+card.id+'">👍 Bien</button><button class="rate-easy" data-action="rate-card" data-quality="5" data-fcid="'+card.id+'">✨ Facile</button></div>':'')}}return'<div class="fc-stats"><div class="fc-stat"><div class="num" style="color:var(--e)">'+du+'</div><div class="label">À revoir</div></div><div class="fc-stat"><div class="num" style="color:var(--p)">'+fr+'</div><div class="label">Nouvelles</div></div><div class="fc-stat"><div class="num" style="color:var(--s)">'+rv+'</div><div class="label">Maîtrisées</div></div></div>'+ch}

function renderQCMTab(c){const cq=QCMS.filter(x=>x.c===c.id);if(cq.length===0)return'<p>Aucun QCM disponible.</p>';if(S.qcmShuffled.length===0||!cq.find(x=>x.id===S.qcmShuffled[0])){S.qcmShuffled=shuffle(cq.map(x=>x.id));S.qcmIndex=0;S.qcmScore=0;S.qcmAnswered=false;S.qcmSelected=-1}if(S.qcmIndex>=S.qcmShuffled.length){const pct=Math.round(S.qcmScore/S.qcmShuffled.length*100);return'<div class="qcm-score"><div style="font-size:3rem;margin-bottom:16px">'+(pct>=80?'🏆':pct>=50?'👍':'📚')+'</div><div class="score-big">'+S.qcmScore+' / '+S.qcmShuffled.length+'</div><p style="color:var(--tl);margin:8px 0">'+pct+'% de bonnes réponses</p><button class="btn btn-primary" data-action="reset-qcm" style="margin-top:16px">🔄 Recommencer</button></div>'}const qcm=QCMS.find(x=>x.id===S.qcmShuffled[S.qcmIndex]);if(!qcm)return'<p>Erreur.</p>';return'<div class="qcm-progress">Question '+(S.qcmIndex+1)+' / '+S.qcmShuffled.length+' — Score : '+S.qcmScore+'</div><div class="qcm-question"><h3>'+qcm.q+'</h3></div><div class="qcm-options">'+qcm.o.map((opt,i)=>{let cls='qcm-option';if(S.qcmAnswered){cls+=' disabled';if(i===qcm.r)cls+=' correct';else if(i===S.qcmSelected)cls+=' wrong'}return'<button class="'+cls+'" data-action="select-option" data-index="'+i+'" '+(S.qcmAnswered?'disabled':'')+'>'+opt+'</button>'}).join('')+'</div>'+(S.qcmAnswered?'<div class="qcm-explanation"><strong>'+(S.qcmSelected===qcm.r?'✅ Correct !':'❌ Incorrect.')+'</strong><br>'+qcm.e+'</div><div style="text-align:center;margin-top:16px"><button class="btn btn-primary" data-action="next-qcm">Suivant →</button></div>':'')}

function renderQuizTab(c){if(!S.apiKey)return'<div class="quiz-notice"><strong>Clé API requise</strong><br>Pour utiliser le Quiz IA, configurez votre clé API Claude dans les paramètres (⚙️).</div><button class="btn btn-primary" data-action="open-settings">⚙️ Configurer la clé API</button>';const msgs=S.quizMessages[c.id]||[];return'<div class="chat-actions"><button class="btn btn-primary" data-action="new-question" '+(S.quizLoading?'disabled':'')+'>💡 Nouvelle question</button><button class="btn btn-secondary" data-action="clear-quiz">🗑️ Effacer</button></div><div class="chat-container"><div class="chat-messages">'+(msgs.length===0?'<p style="color:var(--tl);text-align:center;padding:40px">Cliquez sur "Nouvelle question" pour commencer.</p>':'')+msgs.map(m=>'<div class="chat-msg '+m.role+'"><div class="msg-bubble">'+m.content.replace(/\n/g,'<br>')+'</div></div>').join('')+(S.quizLoading?'<div class="chat-msg assistant"><div class="msg-bubble"><span class="loading">Réflexion en cours</span></div></div>':'')+'</div><div class="chat-input-area"><input type="text" id="quiz-input" placeholder="Votre réponse..." '+(S.quizLoading?'disabled':'')+'><button class="btn btn-primary" data-action="send-quiz" '+(S.quizLoading?'disabled':'')+'>Envoyer</button></div></div>'}

function renderModal(){return'<div class="modal-overlay" data-action="close-settings"><div class="modal" onclick="event.stopPropagation()"><h2>⚙️ Paramètres</h2><label>Clé API OpenRouter (gratuite)</label><input type="text" id="api-key-input" placeholder="sk-or-..." value="'+(S.apiKey||'')+'"><label style="margin-top:12px;display:block">Modèle (ex: mistralai/mistral-7b-instruct:free)</label><input type="text" id="api-model-input" placeholder="provider/model:free" value="'+(S.apiModel||'mistralai/mistral-7b-instruct:free')+'"><p style="font-size:.8rem;color:var(--tl);margin-bottom:16px">Voir les modèles gratuits sur openrouter.ai/models</p><div class="modal-actions"><button class="btn btn-secondary" onclick="S.showSettings=false;render()">Annuler</button><button class="btn btn-primary" onclick="var i=document.getElementById(\'api-key-input\');var m=document.getElementById(\'api-model-input\');S.apiKey=i?i.value.trim():\'\';S.apiModel=m?m.value.trim():\'\';S.showSettings=false;saveState();showToast(\'Paramètres sauvegardés\')">Sauvegarder</button></div></div></div>'}

function showToast(m){S.toastMsg=m;S.toastVisible=true;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{S.toastVisible=false;const t=document.querySelector('.toast');if(t)t.classList.remove('show')},2500)}

// ===== EVENTS =====
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='open-course'){S.page='course';S.courseId=+el.dataset.id;S.tab='cours';S.expandedBlocks={};S.fcFlipped=false;S.fcIndex=0;S.qcmShuffled=[];S.qcmIndex=0;S.qcmScore=0;S.qcmAnswered=false;render()}
else if(a==='back'){S.page='library';S.courseId=null;render()}
else if(a==='set-tab'){S.tab=el.dataset.tab;S.fcFlipped=false;S.fcIndex=0;if(el.dataset.tab==='qcm'){S.qcmShuffled=[];S.qcmIndex=0;S.qcmScore=0;S.qcmAnswered=false}render()}
else if(a==='toggle-block'){const k=el.dataset.key;S.expandedBlocks[k]=!S.expandedBlocks[k];render()}
else if(a==='flip-card'){S.fcFlipped=!S.fcFlipped;render()}
else if(a==='rate-card'){const q=+el.dataset.quality,fid=+el.dataset.fcid;S.fcProgress[fid]=sm2(q,S.fcProgress[fid]||{});S.fcFlipped=false;S.fcIndex++;saveState();showToast('Progression sauvegardée')}
else if(a==='select-option'&&!S.qcmAnswered){const idx=+el.dataset.index;S.qcmSelected=idx;S.qcmAnswered=true;const qcm=QCMS.find(x=>x.id===S.qcmShuffled[S.qcmIndex]);if(qcm&&idx===qcm.r)S.qcmScore++;if(qcm)S.qcmAnswers[qcm.id]=idx;saveState();render()}
else if(a==='next-qcm'){S.qcmIndex++;S.qcmAnswered=false;S.qcmSelected=-1;render()}
else if(a==='reset-qcm'){S.qcmShuffled=[];S.qcmIndex=0;S.qcmScore=0;S.qcmAnswered=false;S.qcmSelected=-1;render()}
else if(a==='cycle-status'){e.stopPropagation();const id=+el.dataset.id,order=['upcoming','inprogress','completed'],cur=S.statuses[id]||'upcoming';S.statuses[id]=order[(order.indexOf(cur)+1)%3];saveState();render()}
else if(a==='open-settings'){S.showSettings=true;render()}
else if(a==='close-settings'){if(el.classList.contains('modal-overlay')&&e.target!==el)return;S.showSettings=false;render()}
else if(a==='save-settings'){const inp=document.getElementById('api-key-input');S.apiKey=inp?inp.value.trim():'';S.showSettings=false;saveState();showToast('Clé API sauvegardée')}
else if(a==='new-question'){askNewQ()}
else if(a==='clear-quiz'){if(S.courseId){S.quizMessages[S.courseId]=[];saveState();render()}}
else if(a==='send-quiz'){handleSendQuiz()}
});

document.addEventListener('keydown',e=>{
if(S.page==='course'&&S.tab==='flashcards'){const q=fcQueue(S.courseId);if(q.length===0)return;const card=q[S.fcIndex%q.length];if(!card)return;if(e.code==='Space'){e.preventDefault();S.fcFlipped=!S.fcFlipped;render()}if(S.fcFlipped){const rate=(qual)=>{S.fcProgress[card.id]=sm2(qual,S.fcProgress[card.id]||{});S.fcFlipped=false;S.fcIndex++;saveState();showToast('Sauvegardé')};if(e.key==='1')rate(1);if(e.key==='2')rate(3);if(e.key==='3')rate(4);if(e.key==='4')rate(5)}}
if(e.key==='Enter'&&S.page==='course'&&S.tab==='quiz'&&!S.quizLoading){const inp=document.getElementById('quiz-input');if(inp&&document.activeElement===inp){e.preventDefault();handleSendQuiz()}}
});

// ===== AI =====
function courseCtx(cid){const c=COURSES.find(x=>x.id===cid);if(!c)return'';return c.blocks.map(b=>b.t+':\n'+b.h.replace(/<[^>]*>/g,'').replace(/&[a-z]+;/g,' ')).join('\n\n')}

async function callClaude(cid,msgs){const c=COURSES.find(x=>x.id===cid);const ctx=courseCtx(cid);const sys='Tu es un professeur bienveillant mais rigoureux. Tu enseignes : '+(c?c.title:'pharmacologie')+'. Pose des questions pertinentes et évalue les réponses. Corrige les erreurs avec des explications pédagogiques. Encourage les bonnes réponses.\n\nContenu du cours :\n'+ctx;const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},body:JSON.stringify({model:S.apiModel||'mistralai/mistral-7b-instruct:free',max_tokens:1024,messages:[{role:'system',content:sys}].concat(msgs.map(m=>({role:m.role,content:m.content})))})});if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error?.message||'Erreur HTTP '+res.status)}const data=await res.json();return data.choices[0].message.content}

async function askNewQ(){if(!S.courseId||S.quizLoading)return;const cid=S.courseId;if(!S.quizMessages[cid])S.quizMessages[cid]=[];S.quizMessages[cid].push({role:'user',content:'Pose-moi une question sur ce cours.'});S.quizLoading=true;render();try{const r=await callClaude(cid,S.quizMessages[cid]);S.quizMessages[cid].push({role:'assistant',content:r});saveState()}catch(err){S.quizMessages[cid].push({role:'assistant',content:'Erreur : '+err.message})}S.quizLoading=false;render()}

async function handleSendQuiz(){const inp=document.getElementById('quiz-input');if(!inp||!inp.value.trim()||S.quizLoading)return;const cid=S.courseId;if(!S.quizMessages[cid])S.quizMessages[cid]=[];S.quizMessages[cid].push({role:'user',content:inp.value.trim()});S.quizLoading=true;render();try{const r=await callClaude(cid,S.quizMessages[cid]);S.quizMessages[cid].push({role:'assistant',content:r});saveState()}catch(err){S.quizMessages[cid].push({role:'assistant',content:'Erreur : '+err.message})}S.quizLoading=false;render()}

// ===== INIT =====
render();
</script>
